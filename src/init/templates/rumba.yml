# Rumba "__NAME__". A person opts a ticket in by adding the label rumba:__NAME__.
# Keys come from environment variables, never from this file.

# Globs this rumba is expected to work in. A change outside them is allowed,
# and listed in the pull request as outside scope.
paths:
  - "**"

tracker:
  kind: github              # github | linear
  # linear only: which tickets belong to this repository
  # team: ENG               # required for linear
  # project: Checkout       # optional

agent:
  kind: claude-code         # claude-code | gemini-cli
  # model: claude-haiku-5-5 # optional; the agent's default if omitted

environment:
  kind: docker              # docker | vercel-preview
  # docker: how to bring the project up, run a command inside it, and take it down.
  up: docker compose up -d --wait
  exec: docker compose exec -T app
  down: docker compose down -v
  # Files the agent may not change. The default protects the compose files only;
  # add anything else that changes how the containers start, such as .env.
  # protected: ["docker-compose*.y*ml", "compose*.y*ml", ".env"]
  #
  # vercel-preview instead:
  # kind: vercel-preview
  # project_id: prj_123     # optional; VERCEL_PROJECT_ID is used if omitted
  # protected: ["vercel.json"]

# verify:
#   test: npm test          # optional: the project's own tests, run against the change

# limits:
#   max_tickets_per_run: 3
#   minutes_per_ticket: 30
#   max_fix_attempts: 2

# labels:                   # optional: rename the labels Rumba uses
#   opt_in: rumba:__NAME__
#   state_prefix: "rumba-state:"
#   approved: rumba-approved
#   retry: rumba-retry
