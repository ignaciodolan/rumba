# Rumba "__NAME__". A person opts a ticket in by adding the label rumba:__NAME__.
# Keys come from environment variables, never from this file.

# Globs this rumba is expected to work in. A change outside them is allowed,
# and listed in the pull request as outside scope.
paths:
  - "**"

tracker:
  kind: github              # github | linear
  # linear only: which tickets belong to this repository
  # team: ENG               # required for linear
  # project: Checkout       # optional

agent:
  kind: claude-code         # claude-code | gemini-cli
  # model: claude-haiku-5-5 # optional; the agent's default if omitted

environment:
  kind: docker              # docker | vercel-preview
  # docker: how to bring the project up, run a command inside it, and take it down.
  # Rumba runs these three commands on the host from a checkout of the default
  # branch, never from the code under test, and puts the path of the code under
  # test in RUMBA_WORKDIR. Your compose file must hand that path to the container,
  # for example with a mount that also works when you run compose by hand:
  #     volumes:
  #       - ${RUMBA_WORKDIR:-.}:/app
  # Give RUMBA_WORKDIR to Docker only. Never read or run a file under it on the host.
  # Each command runs in a fresh folder, and Rumba sets COMPOSE_PROJECT_NAME so compose
  # finds its containers: do not pass -p, and do not mount `.` into a container read-write.
  up: docker compose up -d --wait
  exec: docker compose exec -T app
  down: docker compose down -v
  # command_timeout_minutes: 10   # the limit of each command; checks and verify.test run through exec
  # More files the agent may not change. .rumba/, .github/ and .env are always
  # protected. This list replaces the default, which is the files that define the
  # containers:
  # protected: ["docker-compose*.y*ml", "compose*.y*ml", "Dockerfile*", "*.dockerfile", ".dockerignore"]
  #
  # vercel-preview instead:
  # kind: vercel-preview
  # project_id: prj_123     # optional; VERCEL_PROJECT_ID is used if omitted
  # protected: ["vercel.json"]

# verify:
#   test: npm test          # optional: the project's own tests, run on the default branch first and against the change

# sandbox:
#   node: 22                # optional: the Node major version of the agent's container (20 or later)

# limits:
#   max_tickets_per_run: 3
#   minutes_per_ticket: 30
#   max_fix_attempts: 2

# labels:                   # optional: rename the labels Rumba uses
#   opt_in: rumba:__NAME__
#   state_prefix: "rumba-state:"
#   approved: rumba-approved
#   retry: rumba-retry
