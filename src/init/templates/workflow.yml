# managed by rumba init
# Runs each rumba on a schedule, one job per rumba. `rumba init <name>` adds new names to the matrix.
name: rumba

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rumba: [__NAMES__]
    concurrency:
      group: rumba-${{ matrix.rumba }}
      cancel-in-progress: false
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Keep the checkout's stored credentials (the default; do not set persist-credentials: false).
      # Rumba fetches the default branch with them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # rumba-cli is not published to npm yet, and until the name is taken anyone could publish a
      # package under it. Do not enable this workflow until rumba-cli is published, or replace this
      # step with an install from a checkout of Rumba you trust.
      # With the default Actions token, turn on the repository setting "Allow GitHub Actions to
      # create and approve pull requests", or opening the pull request fails after all the work.
      - name: Run rumba
        run: npx rumba-cli run --name ${{ matrix.rumba }}
        env:
          RUMBA_GITHUB_TOKEN: ${{ secrets.RUMBA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RUMBA_GITHUB_LOGIN: ${{ vars.RUMBA_GITHUB_LOGIN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
